[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestorasim"
version = "0.1.0"
description = "MVP educacional de sistema de gestão de ativos (dados 100% simulados)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.40", "plotly>=5.20"]

[tool.setuptools.packages.find]
include = ["gestorasim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
